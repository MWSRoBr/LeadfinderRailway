<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Finder – Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#f8f7f4;color:#111;min-height:100vh}
.hdr{background:#333;padding:0 40px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.hdr-sub{font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#CED994}
.hdr-title{font-size:15px;font-weight:700;color:#fff;letter-spacing:.08em;text-transform:uppercase}
.hdr-user{font-size:12px;color:#888}
.btn-out{background:none;border:1px solid #555;color:#aaa;padding:5px 14px;border-radius:5px;font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif}
.main{max-width:1100px;margin:0 auto;padding:36px 24px}
.page-title{font-family:'EB Garamond',serif;font-size:28px;font-weight:400;margin-bottom:4px}
.page-sub{font-size:13px;color:#888;margin-bottom:28px}
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:28px}
.kpi{background:#fff;border:1.5px solid #e4e0d8;border-radius:8px;padding:16px 20px}
.kpi-val{font-size:28px;font-weight:500;line-height:1;color:#111}
.kpi-lbl{font-size:11px;color:#888;margin-top:6px;text-transform:uppercase;letter-spacing:.06em}
.card{background:#fff;border:1.5px solid #e4e0d8;border-radius:8px;padding:20px;margin-bottom:20px}
.card-title{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#888;margin-bottom:16px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:8px 10px;color:#888;font-weight:400;border-bottom:1.5px solid #e4e0d8;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.tbl td{padding:8px 10px;border-bottom:1px solid #f0ede8;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tag{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:500}
.tag-active{background:#CED994;color:#2a4a0a}
.tag-login{background:#e8f0fb;color:#2a4a7f}
.tag-none{background:#f0ede8;color:#999}
.bar-bg{background:#f0ede8;border-radius:3px;height:6px;overflow:hidden;min-width:60px}
.bar-fill{height:100%;border-radius:3px;background:#3d6b1a}
.sc{display:inline-block;min-width:22px;text-align:center;padding:1px 6px;border-radius:4px;font-size:11px;font-weight:600}
.sc-h{background:#CED994;color:#2a4a0a}
.sc-m{background:#eee;color:#555}
.sc-l{background:#f9e8e8;color:#a33}
.chart-wrap{position:relative;height:220px}
.time-btns{display:flex;gap:8px;margin-bottom:16px}
.time-btn{padding:5px 14px;border:1.5px solid #e4e0d8;border-radius:20px;background:#fff;font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;color:#555;transition:all .15s}
.time-btn.active{background:#111;color:#fff;border-color:#111}
.region-mini{display:flex;flex-wrap:wrap;gap:8px}
.region-tag{font-size:12px;padding:3px 12px;border-radius:20px;background:#f4f8e8;color:#3d6b1a;font-weight:500}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;display:flex;align-items:center;justify-content:center}
.login-box{background:#fff;border-radius:12px;padding:40px;max-width:380px;width:90%}
.login-title{font-family:'EB Garamond',serif;font-size:24px;margin-bottom:4px}
.login-sub{font-size:12px;color:#888;letter-spacing:.1em;text-transform:uppercase;margin-bottom:28px}
.login-lbl{font-size:13px;color:#555;margin-bottom:8px}
.login-inp{width:100%;padding:12px 14px;border:2px solid #e0e0e0;border-radius:8px;font-size:15px;font-family:'DM Sans',sans-serif;outline:none;margin-bottom:12px}
.login-btn{width:100%;padding:14px;background:#111;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.login-err{font-size:12px;color:#b22;min-height:18px;margin-bottom:10px}
.spinner{text-align:center;padding:60px;color:#888;font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
</style>
</head>
<body>

<div class="overlay" id="loginOverlay">
  <div class="login-box">
    <div class="login-title">MYWORKSPACE</div>
    <div class="login-sub">Project Finder · Dashboard</div>
    <div class="login-lbl">Passwort</div>
    <input type="password" class="login-inp" id="pwInput" placeholder="Dein Passwort...">
    <div class="login-err" id="pwErr"></div>
    <button class="login-btn" id="loginBtn" onclick="doLogin()">Anmelden</button>
  </div>
</div>

<div class="hdr">
  <div>
    <div class="hdr-sub">MYWORKSPACE</div>
    <div class="hdr-title">Project Finder · Dashboard</div>
  </div>
  <div style="display:flex;align-items:center;gap:16px">
    <span class="hdr-user" id="hdrUser"></span>
    <button class="btn-out" onclick="logout()">Abmelden</button>
  </div>
</div>

<div class="main" id="mainContent">
  <div class="spinner" id="spinner">Daten werden geladen...</div>
</div>

<script>
var _pw = localStorage.getItem('db_pw') || null;
var _rows = [];
var _chart = null;
var _currentRange = '30';

// Deutsche Feiertage 2026 (bundesweit)
var FEIERTAGE_2026 = [
  '01.01.2026','06.01.2026','03.04.2026','05.04.2026','06.04.2026',
  '01.05.2026','14.05.2026','25.05.2026','04.06.2026','03.10.2026',
  '25.12.2026','26.12.2026'
];

// Milestones
var MILESTONES = [
  { datum: '22.06.2026', label: 'Rollout Salesteam', color: '#3d6b1a' },
  { datum: '20.07.2026', label: 'Firmennamen-Logging & Web-Recherchen aktiv', color: '#2a4a7f' }
];

async function doLogin() {
  var pw = document.getElementById('pwInput').value.trim();
  if (!pw) return;
  document.getElementById('loginBtn').disabled = true;
  document.getElementById('loginBtn').textContent = 'Prüfe...';
  var resp = await fetch('/api/dashboard-data', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({password: pw})
  });
  var data = await resp.json();
  if (data.error) {
    document.getElementById('pwErr').textContent = data.error;
    document.getElementById('loginBtn').disabled = false;
    document.getElementById('loginBtn').textContent = 'Anmelden';
    return;
  }
  _pw = pw;
  localStorage.setItem('db_pw', pw);
  _rows = data.rows;
  document.getElementById('loginOverlay').style.display = 'none';
  renderDashboard();
}

function logout() { localStorage.removeItem('db_pw'); location.reload(); }

document.getElementById('pwInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

async function init() {
  if (_pw) {
    var resp = await fetch('/api/dashboard-data', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({password: _pw})
    });
    var data = await resp.json();
    if (data.error) { localStorage.removeItem('db_pw'); _pw = null; document.getElementById('spinner').style.display='none'; return; }
    _rows = data.rows;
    document.getElementById('loginOverlay').style.display = 'none';
    renderDashboard();
  } else {
    document.getElementById('spinner').style.display = 'none';
  }
}

function parseNum(v) {
  if (!v || v === '–' || v === '-') return 0;
  var n = parseInt(v); return isNaN(n) ? 0 : n;
}

function parseDateDE(s) {
  if (!s) return null;
  var p = s.split('.');
  if (p.length < 3) return null;
  return new Date(parseInt(p[2]), parseInt(p[1])-1, parseInt(p[0]));
}

function formatDateDE(d) {
  return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear();
}

function isWeekend(d) { var day = d.getDay(); return day === 0 || day === 6; }
function isFeiertag(d) { return FEIERTAGE_2026.includes(formatDateDE(d)); }

function renderDashboard() {
  var searches = _rows.filter(r => r[4] === 'Suchlauf');
  var logins = _rows.filter(r => r[4] === 'Login');
  var webRecherchen = _rows.filter(r => r[4] === 'Web-Recherche');
  var firmenProfile = _rows.filter(r => r[4] === 'Firmenprofil');

  // Unique project and company names
  var allProjNamen = new Set();
  var allFirmNamen = new Set();
  searches.forEach(r => {
    if (r[7] && r[7] !== '–') r[7].split(',').forEach(n => { var t=n.trim(); if(t) allProjNamen.add(t); });
    if (r[8] && r[8] !== '–') r[8].split(',').forEach(n => { var t=n.trim(); if(t) allFirmNamen.add(t); });
  });

  var totalSearches = searches.length;
  var uniqueUsers = [...new Set(searches.map(r => r[2]))].length;
  var uniqueProj = allProjNamen.size;
  var uniqueFirm = allFirmNamen.size;
  var totalDetails = webRecherchen.length + firmenProfile.length;

  // Per user stats
  var userStats = {};
  searches.forEach(r => {
    var u = r[2];
    if (!userStats[u]) userStats[u] = {searches:0, proj:0, firm:0, detailsProj:0, detailsFirm:0};
    userStats[u].searches++;
    userStats[u].proj += parseNum(r[5]);
    userStats[u].firm += parseNum(r[6]);
  });
  webRecherchen.forEach(r => {
    var u = r[2];
    if (!userStats[u]) userStats[u] = {searches:0, proj:0, firm:0, detailsProj:0, detailsFirm:0};
    userStats[u].detailsProj = (userStats[u].detailsProj||0) + 1;
  });
  firmenProfile.forEach(r => {
    var u = r[2];
    if (!userStats[u]) userStats[u] = {searches:0, proj:0, firm:0, detailsProj:0, detailsFirm:0};
    userStats[u].detailsFirm = (userStats[u].detailsFirm||0) + 1;
  });

  var loggedIn = [...new Set(logins.map(r => r[2]))];
  var allUsers = ['Robin','Walter','Ralf','Thorben',
    'Jörg','Michael','Nasir','Dusan',
    'Daniel','Jonathan','Holger','Antonios'];

  // PLZ regions
  var plzCount = {};
  searches.forEach(r => { var p=r[3]||'–'; plzCount[p]=(plzCount[p]||0)+1; });
  var plzSorted = Object.entries(plzCount).sort((a,b)=>b[1]-a[1]);

  var maxS = Math.max(...Object.values(userStats).map(u=>u.searches), 1);

  document.getElementById('mainContent').innerHTML = `
    <div class="page-title">Nutzungsübersicht</div>
    <div class="page-sub">Live-Daten aus Google Sheets · ${_rows.length} Einträge gesamt</div>

    <div class="kpi-row">
      <div class="kpi"><div class="kpi-val">${totalSearches}</div><div class="kpi-lbl">Suchläufe</div></div>
      <div class="kpi"><div class="kpi-val">${uniqueUsers}</div><div class="kpi-lbl">Aktive Nutzer</div></div>
      <div class="kpi"><div class="kpi-val">${uniqueProj || '–'}</div><div class="kpi-lbl">Einzigartige Projekte</div></div>
      <div class="kpi"><div class="kpi-val">${uniqueFirm || '–'}</div><div class="kpi-lbl">Einzigartige Firmen</div></div>
      <div class="kpi"><div class="kpi-val">${totalDetails}</div><div class="kpi-lbl">Detail-Recherchen</div></div>
    </div>

    <div class="card">
      <div class="card-title">Suchläufe pro Tag</div>
      <div class="time-btns">
        <button class="time-btn${_currentRange==='7'?' active':''}" onclick="setRange('7')">Letzte Woche</button>
        <button class="time-btn${_currentRange==='14'?' active':''}" onclick="setRange('14')">Letzte 2 Wochen</button>
        <button class="time-btn${_currentRange==='30'?' active':''}" onclick="setRange('30')">Letzte 30 Tage</button>
        <button class="time-btn${_currentRange==='365'?' active':''}" onclick="setRange('365')">Letztes Jahr</button>
      </div>
      <div class="chart-wrap" style="position:relative">
        <canvas id="trendChart" role="img" aria-label="Suchläufe pro Tag"></canvas>
        <div id="msTooltip" style="display:none;position:absolute;background:#111;color:#fff;padding:8px 12px;border-radius:6px;font-size:12px;line-height:1.6;pointer-events:none;max-width:260px;z-index:10"></div>
      </div>
      <div style="margin-top:16px;padding-top:12px;border-top:1px solid #f0ede8;display:flex;flex-wrap:wrap;gap:16px">
        ${MILESTONES.map(function(ms,i){ return '<div style="display:flex;align-items:center;gap:8px;font-size:12px;color:#555"><span style="display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:'+ms.color+';color:#fff;font-size:10px;font-weight:700;flex-shrink:0">'+(i+1)+'</span><span><strong>'+ms.datum+'</strong> — '+ms.label+'</span></div>'; }).join('')}
      </div>
    </div>

    <div class="card">
      <div class="card-title">Alle Nutzer</div>
      <table class="tbl">
        <tr>
          <th>Nutzer</th>
          <th>Status</th>
          <th>Suchläufe</th>
          <th>Aktivität</th>
          <th style="text-align:right">Proj.</th>
          <th style="text-align:right">Firm.</th>
          <th style="text-align:right">Proj.-Rec.</th>
          <th style="text-align:right">Firm.-Prof.</th>
        </tr>
        ${allUsers.map(u => {
          var s = userStats[u];
          var isLogin = loggedIn.includes(u);
          var tag = s ? `<span class="tag tag-active">Aktiv</span>`
                      : isLogin ? `<span class="tag tag-login">Eingeloggt</span>`
                      : `<span class="tag tag-none">Noch nicht</span>`;
          var bar = s ? `<div class="bar-bg"><div class="bar-fill" style="width:${Math.round(s.searches/maxS*100)}%"></div></div>` : `<div class="bar-bg"></div>`;
          return `<tr>
            <td style="font-weight:500">${u}</td>
            <td>${tag}</td>
            <td>${s ? s.searches : '–'}</td>
            <td style="min-width:80px">${bar}</td>
            <td style="text-align:right">${s ? s.proj : '–'}</td>
            <td style="text-align:right">${s ? s.firm : '–'}</td>
            <td style="text-align:right">${s && s.detailsProj ? s.detailsProj : '–'}</td>
            <td style="text-align:right">${s && s.detailsFirm ? s.detailsFirm : '–'}</td>
          </tr>`;
        }).join('')}
      </table>
    </div>

    <div class="card">
      <div class="card-title">Gesuchte Regionen</div>
      <div class="region-mini">
        ${plzSorted.map(([plz, cnt]) => `<span class="region-tag">${plz} <strong>${cnt}×</strong></span>`).join('')}
      </div>
    </div>
  `;

  renderChart(_currentRange, searches);

  // Milestone mouseover
  var msCvs = document.getElementById('trendChart');
  var msTip = document.getElementById('msTooltip');
  if (msCvs && msTip) {
    msCvs.addEventListener('mousemove', function(e) {
      if (!_chart || isYear || milestoneData.length === 0) { msTip.style.display='none'; return; }
      var rect = msCvs.getBoundingClientRect();
      var mx = e.clientX - rect.left, my = e.clientY - rect.top;
      var hit = null;
      milestoneData.forEach(function(ms) {
        var cx = _chart.scales.x.getPixelForTick(ms.x);
        var cy = _chart.scales.y.top + 10;
        if (Math.abs(mx-cx)<14 && Math.abs(my-cy)<14) hit = ms;
      });
      if (hit) {
        var num = milestoneData.indexOf(hit)+1;
        var circle = ['①','②','③','④','⑤'][num-1]||num;
        msTip.innerHTML = '<strong style="color:'+hit.color+'">'+circle+' '+hit.datum+'</strong><br>'+hit.label;
        msTip.style.display='block';
        msTip.style.left=(mx+14)+'px';
        msTip.style.top=(my-10)+'px';
      } else { msTip.style.display='none'; }
    });
    msCvs.addEventListener('mouseleave', function(){ msTip.style.display='none'; });
  }
}

function setRange(range) {
  _currentRange = range;
  var searches = _rows.filter(r => r[4] === 'Suchlauf');
  // Update button states
  document.querySelectorAll('.time-btn').forEach(function(btn, i) {
    var ranges = ['7','14','30','365'];
    btn.classList.toggle('active', ranges[i] === range);
  });
  renderChart(range, searches);
}

function renderChart(range, searches) {
  var isYear = range === '365';
  var days = parseInt(range);
  var now = new Date();
  var labels = [], data = [], bgColors = [], borderColors = [], dailyUsers = [];

  if (isYear) {
    // Monthly view
    for (var m = 11; m >= 0; m--) {
      var d = new Date(now.getFullYear(), now.getMonth() - m, 1);
      var key = ('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear();
      labels.push(key);
      var count = searches.filter(function(r) {
        var rd = parseDateDE(r[0]);
        return rd && rd.getMonth() === d.getMonth() && rd.getFullYear() === d.getFullYear();
      }).length;
      data.push(count);
      bgColors.push('rgba(255,255,255,0)');
      borderColors.push('rgba(61,107,26,0)');
    }
  } else {
    // Daily view
    for (var i = days - 1; i >= 0; i--) {
      var d = new Date(now);
      d.setDate(now.getDate() - i);
      var dateStr = formatDateDE(d);
      labels.push(('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.');
      var daySearches = searches.filter(function(r) { return r[0] === dateStr; });
      data.push(daySearches.length);
      // Build user map for tooltip
      var userMap = {};
      daySearches.forEach(function(r){ userMap[r[2]] = (userMap[r[2]]||0)+1; });
      dailyUsers.push({date: dateStr, users: userMap});
      var isWE = isWeekend(d);
      var isFF = isFeiertag(d);
      bgColors.push((isWE||isFF) ? 'rgba(180,178,169,0.15)' : 'rgba(255,255,255,0)');
    }
  }

  if (_chart) { _chart.destroy(); _chart = null; }

  var ctx = document.getElementById('trendChart').getContext('2d');

  // Build milestone annotations as vertical lines via plugin
  var milestoneData = [];
  if (!isYear) {
    MILESTONES.forEach(function(ms) {
      var msDate = parseDateDE(ms.datum);
      if (!msDate) return;
      var startDate = new Date(now);
      startDate.setDate(now.getDate() - (days-1));
      if (msDate >= startDate && msDate <= now) {
        var diff = Math.round((msDate - startDate) / 86400000);
        milestoneData.push({ x: diff, label: ms.label, color: ms.color });
      }
    });
  }

  _chart = new Chart(ctx, {
    type: isYear ? 'bar' : 'line',
    data: {
      labels: labels,
      datasets: [{
        label: 'Suchläufe',
        data: data,
        borderColor: '#3d6b1a',
        backgroundColor: isYear ? '#CED994' : 'rgba(61,107,26,0.08)',
        borderWidth: 2,
        pointRadius: 3,
        pointBackgroundColor: '#3d6b1a',
        tension: 0.3,
        fill: !isYear,
        borderRadius: isYear ? 4 : 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: function(items) {
              var idx = items[0].dataIndex;
              if (isYear) return labels[idx];
              return dailyUsers[idx] ? dailyUsers[idx].date : labels[idx];
            },
            label: function(item) { return ''; },
            afterBody: function(items) {
              var idx = items[0].dataIndex;
              if (isYear || !dailyUsers[idx]) return [];
              var um = dailyUsers[idx].users;
              var lines = [];
              Object.keys(um).sort(function(a,b){ return um[b]-um[a]; }).forEach(function(u){
                lines.push('  ' + u + ' (' + um[u] + '×)');
              });
              return lines.length ? lines : ['  Keine Suchläufe'];
            }
          },
          displayColors: false
        }
      },
      scales: {
        y: { beginAtZero: true, ticks: { stepSize: 1, color: '#888', font:{size:11} }, grid: { color: '#f0ede8' } },
        x: { ticks: { color: '#888', font:{size:10}, maxRotation: 45, autoSkip: days > 30 }, grid: { display: false } }
      }
    },
    plugins: [{
      id: 'customAnnotations',
      afterDraw: function(chart) {
        var ctx2 = chart.ctx;
        var xScale = chart.scales.x;
        var yScale = chart.scales.y;

        // Draw weekend/feiertag shading for daily view
        if (!isYear) {
          for (var i2 = 0; i2 < days; i2++) {
            var d2 = new Date(now);
            d2.setDate(now.getDate() - (days-1-i2));
            if (isWeekend(d2) || isFeiertag(d2)) {
              var x1 = xScale.getPixelForTick(i2) - (xScale.getPixelForTick(1) - xScale.getPixelForTick(0))/2;
              var x2 = x1 + (xScale.getPixelForTick(1) - xScale.getPixelForTick(0));
              ctx2.save();
              ctx2.fillStyle = 'rgba(180,178,169,0.18)';
              ctx2.fillRect(x1, yScale.top, x2-x1, yScale.bottom - yScale.top);
              ctx2.restore();
            }
          }
        }

        // Draw milestone lines
        milestoneData.forEach(function(ms) {
          if (ms.x < 0 || ms.x >= labels.length) return;
          var x = xScale.getPixelForTick(ms.x);
          ctx2.save();
          ctx2.beginPath();
          ctx2.moveTo(x, yScale.top);
          ctx2.lineTo(x, yScale.bottom);
          ctx2.strokeStyle = ms.color;
          ctx2.lineWidth = 2;
          ctx2.setLineDash([4, 3]);
          ctx2.stroke();
          ctx2.setLineDash([]);
          // Number circle at top of line
          var num = milestoneData.indexOf(ms) + 1;
          ctx2.fillStyle = ms.color;
          ctx2.beginPath();
          ctx2.arc(x, yScale.top + 10, 9, 0, Math.PI * 2);
          ctx2.fill();
          ctx2.fillStyle = '#fff';
          ctx2.font = 'bold 10px sans-serif';
          ctx2.textAlign = 'center';
          ctx2.textBaseline = 'middle';
          ctx2.fillText(String(num), x, yScale.top + 10);
          ctx2.textAlign = 'left';
          ctx2.textBaseline = 'alphabetic';
          ctx2.restore();
        });
      }
    }]
  });
}

init();
</script>
